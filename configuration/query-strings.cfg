[zzform.add]
description = "ID of record to copy into a new record"
type = int
min = 1

[zzform.delete]
description = "ID of record to delete"
type = int
min = 1
on_error = zzform.404

[zzform.edit]
description = "ID of record to edit"
type = int
min = 1
on_error = zzform.404

[zzform.insert]
description = "ID of record that was inserted"
type = int
min = 1
on_error = zzform.404

[zzform.list.dir]
description = "Sort direction for list order or group"
type = enum
enum[] = asc
enum[] = desc
on_error = zzform.404

[zzform.noupdate]
description = "ID of record that was not changed"
type = int
min = 1
on_error = zzform.404

[zzform.revise]
description = "ID of record to revise"
type = int
min = 1
on_error = zzform.404

[zzform.show]
description = "ID of record to show"
type = int
min = 1
on_error = zzform.404

[zzform.sync.limit]
description = "Start position for synchronisation"
type = int
min = 0
default = 0
on_error = zzform.404

[zzform.thumbs]
description = "ID of record to create thumbnails for"
type = int
min = 1
on_error = zzform.404

[zzform.update]
description = "ID of record that was updated"
type = int
min = 1
on_error = zzform.404
