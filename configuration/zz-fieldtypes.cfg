[calculated]
description = "Value computed from two or more other fields on the record (numbers or dates)"
presentational = 1

[captcha]
description = "Challenge used to reduce spam on new submissions"
forced[export] = 0
forced[hide_in_list] = 1

[date]
description = "Calendar date"
standard[size] = 10

[datetime]
description = "Date and time"
standard[size] = 19
standard[time_format] = "H:i"

[detail_key]
description = "Legacy link to a sibling detail row’s ID (not the main record)"
deprecated = 1

[display]
description = "Shows a formatted record value or fixed text on the record and in lists"
presentational = 1

[foreign]
description = "Related record shown for context; not editable"
presentational = 1
deprecated = 1

[foreign_id]
description = "Links this row by ID to another record created on the same form"

[foreign_key]
description = "Hidden parent record ID for a detail row; set automatically on save"

[foreign_table]
description = "Separate record on the same form; saved first and linked via `foreign_id`"

[geo_point]
description = "Geographic point or map location"

[hidden]
description = "Hidden input; value is preset or taken from the record and cannot be edited"

[id]
description = "Primary key of the record"
standard[dont_sort] = 1

[identifier]
description = "Stable, human-readable identifier"

[image]
description = "Picture shown on the form or in lists"
presentational = 1

[ip]
description = "IP address"

[ipv4]
description = "IPv4 address"
forced[maxlength] = 15
forced[size] = 15

[list_function]
description = "Custom content in the list view"
presentational = 1

[mail]
description = "E-mail address"

[mail+name]
description = "E-mail address(es) together with name(s)"

[memo]
description = "Longer text over several lines"

[number]
description = "Numeric field with configurable types and formatting, including coordinates, currency, and more"
standard[size] = 16

[option]
description = "One-time option for this save; choice not stored"
forced[export] = 0
forced[hide_in_list] = 1

[parameter]
description = "Structured key/value settings"

[password]
description = "Password for this website"
forced[maxlength] = %%% setting login_password_maxlength %%%
standard[minlength] = %%% setting login_password_minlength %%%

[password_change]
description = "Change password for this website"
like = password

[phone]
description = "Phone number"

[predefined]
description = "Internal preset value"
scope[] = internal

[select]
description = "Selection from a fixed list or query; one or many"
standard[max_select] = %%% setting zzform_max_select %%%
standard[max_select_val_len] = %%% setting zzform_max_select_val_len %%%

[sequence]
description = "Position in order; changing it reorders the other rows automatically"
like = number

[subtable]
description = "Table of detail rows belonging to the main record"

[text]
description = "Single-line text"
standard[size] = 32

[time]
description = "Time of day"
forced[size] = 8
standard[time_format] = "H:i"

[timestamp]
description = "Time of save, set automatically"
standard[size] = 19

[translation_key]
description = "Links a translation row to its source field"

[unix_timestamp]
description = "Date and time represented as seconds since 1970-01-01"

[upload_image]
description = "File upload; optional thumbnails and other sizes"

[url]
description = "Web address (link)"
standard[max_select_val_len] = %%% setting zzform_max_select_val_len %%%

[url+placeholder]
description = "URL or path template; supports `*` wildcards and `%…%` placeholders"
standard[max_select_val_len] = %%% setting zzform_max_select_val_len %%%

[username]
description = "Username on a website or service; shown as @name with profile link"

[write_once]
description = "Editable when creating the record; cannot be changed later"
